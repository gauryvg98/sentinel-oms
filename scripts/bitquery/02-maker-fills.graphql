# THE PRICE TAPE. Every fill routed through World's in-house maker (JanusFI).
# We do NOT need the instruction arguments decoded -- prediCt's IDL is withheld and
# it does not matter. Price is recoverable purely from the balance deltas:
#
#     price_per_$1_payout  =  CASH_delta  /  outcome_token_delta
#
# because an outcome token pays exactly 1 CASH if it wins. Pair each CASH movement
# with the outcome-token movement in the same transaction and the realized price of
# every trade in the market falls out.
#
# Swap the address for BisonFI (2DNbzPochEcyCcWMbL4d9S3u9QqQEj5bbe6cSZFvKsbh) to
# cover the independent maker too; both must be summed for a complete tape.
{
  Solana(network: solana) {
    InstructionBalanceUpdates(
      where: {
        Instruction: {
          Program: { Address: { is: "JanusXpm3gsW3c9ErNoUgHppL8dGLvZKB7uekkJEYFP" } }
        }
        Transaction: { Result: { Success: true } }
      }
      limit: { count: 200 }
      orderBy: { descending: Block_Time }
    ) {
      Block { Time Slot }
      Transaction { Signature Signer }
      BalanceUpdate {
        Amount
        PreBalance
        PostBalance
        Currency { MintAddress Symbol Name Decimals }
        Account { Address Owner }
      }
    }
  }
}
