# Sentinel OMS on Fly.io — ONE always-on machine.
#
# Single-writer safety: the account holds a Postgres advisory lock; a second
# machine cannot write (it would fail to claim the lock and exit). So this app
# must run exactly one machine — never `fly scale count 2`.
#
# Secrets are NOT here. Set them with `fly secrets set` (see DEPLOY.md):
#   DATABASE_URL, BINANCE_FUTURES_KEY, BINANCE_FUTURES_SECRET, SENTINEL_ADMIN_TOKEN

app = "sentinel-oms"
# Singapore — close to Binance's servers (Asia) so order placement is one short
# RTT (~5-50ms) instead of ~400ms from the US. Keep the DB in the same region.
primary_region = "sin"

[build]

# Recreate the single machine in place on deploy, so two writers never overlap.
[deploy]
  strategy = "immediate"

[env]
  HOST = "0.0.0.0"
  PORT = "8000"

  # Public read-only demo: every control is refused unless the browser carries
  # the admin cookie (drop it once via /admin?token=$SENTINEL_ADMIN_TOKEN).
  SENTINEL_PUBLIC_READONLY = "true"

  # Non-secret trading config (mirror of .env, minus keys/DSN).
  SENTINEL_VENUE = "futures"
  # 2 bots, BTC only: BTCUSDT on the USDT margin pool, BTCUSDC on the USDC pool.
  # Same underlying on both pools, so both fund from separate balances but take
  # the SAME directional signal (identical SMA on BTC) — this is 2x BTC exposure,
  # not diversification. Chosen deliberately to concentrate on BTC's deep book
  # (best fills, lowest churn) after ETHUSDC's thin-book fragmentation bled fees.
  SENTINEL_SYMBOLS = "BTCUSDT,BTCUSDC"
  SENTINEL_STRATEGY = "sma-ls"
  SENTINEL_STRATEGY_INTERVAL = "1h"
  SENTINEL_STRATEGY_USDT = "200"
  # Fat-finger backstop only (per-symbol |position| cap = this / price). Must
  # clear the 25x sizing headroom (~pool/3 × 25 ≈ 33k notional) or it would
  # silently clamp effective leverage; risk_pct + stops are the real protection.
  SENTINEL_MAX_NOTIONAL = "200000"
  # 25x: Binance leverage BRACKETS cap max notional per position at each
  # leverage tier — at 100x alts allow only ~5-10k notional and our 25-50k
  # risk-sized orders got -2027 rejects. 25x brackets allow 100k+. Old note:: sizing stays RISK-driven (eff lev =
  # risk_pct/stop_pct = 10-20x with 2% risk and 0.1-0.2% stops), so 100x mostly
  # means less margin posted per position. Symbols whose Binance bracket caps
  # below 100 reject the setting and keep their previous leverage (non-fatal).
  SENTINEL_LEVERAGE = "100"
  # 25 (= the exchange setting): sizing may now use the FULL equity share as
  # margin. The old conservative static cap (10x, before that 15x) existed only
  # to leave room for margin sizing couldn't see; the closed-loop margin clamp
  # (risk sizing subtracts the position's and the resting entry's ACTUAL margin,
  # with a 10% buffer) supersedes it — -2019 is prevented by measurement, not by
  # under-levering every order.
  SENTINEL_MAX_LEVERAGE = "100"
  # 2%: sizing knob, reverted from the 0.10 ramp (which sized ~20-33% of the pool
  # into margin per trade and cost ~10% of the pool per stop-out — too hot).
  # qty = risk_pct*equity/stop_dist, so notional = risk_pct*equity/stop_pct and
  # margin/equity = risk_pct/(stop_pct*leverage) = 0.02/(0.005*100) = 4% of the
  # pool committed per trade at the 0.5% stop cap (~6.7% at the 0.3% floor).
  # Loss-at-stop = risk_pct*equity = ~2% of the bot's pool. Stops unchanged.
  # Eff lev = risk_pct/stop_pct = 4-6.7x, far under the 100x cap.
  SENTINEL_RISK_PCT = "0.02"
  SENTINEL_MULTI_ASSET_MARGIN = "false"
  # Tight stops (0.1-0.2% of price) with TP at 2.5x the stop — 5.5x proved
  # unreachable on 1m bars (stops always hit first). 2.5x breaks even at ~29%
  # winners. Loss per stop-out stays ~risk_pct of the bot's equity share.
  SENTINEL_SMA_STOP_CAP_PCT = "0.005"
  SENTINEL_SMA_STOP_FLOOR_PCT = "0.003"
  SENTINEL_RR = "1.5"
  # Ratcheting trail: the SL follows the position's best price at the stop
  # distance and only ever tightens; fixed TP is disabled while trailing (the
  # trail is the profit-taker — runs are ridden, giveback bounded to ~one sd).
  SENTINEL_TRAIL = "true"
  # After a stop-out, re-enter the SAME regime once 1 closed bar confirms the
  # signal still points the same way (0 = only re-enter on a full signal flip,
  # which benches the bot for hours when a wick trips the trail mid-trend). 1
  # gives one 1h bar of confirmation that the stop wasn't the start of a real
  # reversal, then re-arms — far less time sitting flat while the trade is live.
  SENTINEL_REENTRY_BARS = "1"
  # Exchange-native hard-stop backstop: a reduce-only STOP_MARKET rests ON the
  # venue 0.5% of price BEYOND the software trail and ratchets with it.
  # Catastrophe insurance — if the process dies, the position still has a real
  # stop at the exchange; in normal operation the software trail exits first
  # because it is strictly tighter. Unset/0 disables.
  SENTINEL_HARD_STOP_PCT = "0.005"
  # Reactive momentum via MARKET execution: entries fill instantly at market (no
  # resting maker peg), the signal is evaluated intra-bar off the forming bar
  # EVERY poll (not just on bar close), and a stance reversal flips instantly
  # (market reduce to zero, then market open the other side) without waiting for
  # a bar close. SLs stay software-market either way. Trade-off: taker fees
  # (~2x maker) and higher turnover — chosen deliberately so signals act the
  # moment they form. Unset/"peg" restores the maker-peg behaviour.
  SENTINEL_EXECUTION = "peg"

[http_service]
  internal_port = 8000
  force_https = true
  # Single writer → never auto-scale, never auto-stop; keep exactly one alive.
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  # Liveness only: 200 means the process is up. We deliberately do NOT fail the
  # check when the OMS is halted — halt is an intentional safety state, and
  # restarting won't clear a genuine divergence (it would just crash-loop).
  [[http_service.checks]]
    method = "GET"
    path = "/whoami"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

# 13 bots each hold outbound Binance websockets; on shared-cpu-1x the event loop
# starved (~0.9 load), keepalive pings failed, and market streams dropped so
# marks/PnL froze. shared-cpu-2x + 1GB gives the async loop real headroom.
# (Proper fix is multiplexing all symbols onto ONE combined stream — see notes.)
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
