# PROBE — run this FIRST. Answers three things in one call:
#   1. does Bitquery index the prediCt program at all?
#   2. does it resolve Token-2022 accounts (Token.ProgramId on the outcome mints)?
#   3. what does Program.Method look like for a withheld-IDL Anchor program?
# If Accounts[].Token.Mint comes back null for the outcome mints, Token-2022 is not
# indexed the way we need and the tape must come from raw RPC instead.
{
  Solana(network: solana) {
    Instructions(
      where: {
        Instruction: {
          Program: { Address: { is: "prediCtPZCttYMvm2W3PtxmMxLmT1dtN7riU6Cxh6tM" } }
        }
        Transaction: { Result: { Success: true } }
      }
      limit: { count: 25 }
      orderBy: { descending: Block_Time }
    ) {
      Block { Time Slot }
      Transaction { Signature Signer }
      Instruction {
        Index
        Data
        Program { Address Name Method }
        Accounts { Address IsWritable Token { Mint Owner ProgramId } }
      }
    }
  }
}
