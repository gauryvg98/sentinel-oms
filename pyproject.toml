[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-oms"
version = "0.1.0"
description = "Execution-integrity-first OMS for automated trading"
requires-python = ">=3.11"
dependencies = ["asyncpg>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "docker>=7.0"]
ui = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src"]
asyncio_mode = "auto"
