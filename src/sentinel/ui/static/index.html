<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sentinel · terminal</title>
<style>
  :root {
    --bg: #0a0e0d; --panel: #101614; --edge: #1d2a25; --ink: #cfe3da;
    --dim: #5e7268; --green: #22e07b; --red: #f87171; --amber: #fbbf24;
    --mono: "SF Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--mono);
         font-size: 12.5px; padding: 10px; }
  header { display: flex; align-items: center; gap: 14px; padding: 8px 12px;
           background: var(--panel); border: 1px solid var(--edge);
           border-radius: 8px; margin-bottom: 10px; }
  .brand { color: var(--green); font-weight: 700; letter-spacing: 2px; }
  .chip { padding: 2px 8px; border-radius: 4px; font-size: 11px;
          border: 1px solid var(--edge); }
  .chip.sim { color: var(--amber); border-color: var(--amber); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .ok { background: var(--green); } .bad { background: var(--red); }
  #invs { display: flex; gap: 5px; align-items: center; }
  #invs .dot { box-shadow: 0 0 6px currentColor; }
  .spacer { flex: 1; }
  .grid { display: grid; gap: 10px;
          grid-template-columns: 1.2fr 1fr 1fr;
          grid-template-rows: auto auto auto; }
  .panel { background: var(--panel); border: 1px solid var(--edge);
           border-radius: 8px; padding: 10px 12px; overflow: hidden; }
  .panel h2 { font-size: 10px; color: var(--dim); letter-spacing: 1.5px;
              text-transform: uppercase; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 3px 6px 3px 0; font-size: 12px;
           white-space: nowrap; }
  th { color: var(--dim); font-size: 10px; text-transform: uppercase; }
  .num { text-align: right; }
  .state { padding: 1px 6px; border-radius: 3px; font-size: 10.5px; }
  .state.WORKING, .state.PARTIAL { color: var(--green);
      border: 1px solid var(--green); }
  .state.FILLED { color: var(--dim); border: 1px solid var(--edge); }
  .state.CANCELED, .state.REJECTED { color: var(--dim);
      border: 1px solid var(--edge); }
  .state.UNKNOWN, .state.RECONCILING { color: var(--red);
      border: 1px solid var(--red); animation: pulse 1s infinite; }
  .state.CANCEL_PENDING { color: var(--amber); border: 1px solid var(--amber); }
  @keyframes pulse { 50% { opacity: .4; } }
  .fillbar { background: var(--edge); height: 6px; border-radius: 3px;
             width: 70px; display: inline-block; }
  .fillbar i { display: block; height: 100%; background: var(--green);
               border-radius: 3px; }
  .pos-green { color: var(--green); } .pos-red { color: var(--red); }
  #chaos { display: flex; flex-wrap: wrap; gap: 8px; }
  button { background: transparent; color: var(--green); font-family: var(--mono);
           border: 1px solid var(--green); border-radius: 6px;
           padding: 8px 12px; cursor: pointer; font-size: 12px; }
  button:hover { background: rgba(34, 224, 123, .1); }
  button.danger { color: var(--red); border-color: var(--red); }
  button.danger:hover { background: rgba(248, 113, 113, .1); }
  #log, #ledger { max-height: 180px; overflow-y: auto; }
  .logline { padding: 2px 0; border-bottom: 1px dotted var(--edge);
             font-size: 11.5px; }
  .logline .t { color: var(--dim); }
  .blocked { color: var(--red); } .armed { color: var(--green); }
  .metric { display: inline-block; margin-right: 16px; }
  .metric b { color: var(--green); font-size: 15px; }
  .metric span { color: var(--dim); font-size: 10px; display: block; }
  #toast { position: fixed; bottom: 14px; right: 14px; background: var(--panel);
           border: 1px solid var(--green); border-radius: 6px; padding: 8px 12px;
           opacity: 0; transition: opacity .3s; max-width: 380px; }
  .wide { grid-column: span 2; }
</style>
</head>
<body>
<header>
  <span class="brand">SENTINEL</span>
  <span class="chip sim" id="authority">SIM</span>
  <span id="accepting"><span class="dot ok"></span> accepting</span>
  <span id="invs" title="live invariants"></span>
  <span class="spacer"></span>
  <span id="mark" class="pos-green"></span>
  <span id="conn" class="dim"><span class="dot bad"></span> connecting…</span>
</header>

<div class="grid">
  <div class="panel">
    <h2>Orders</h2>
    <table><thead><tr><th>key</th><th>side</th><th>fill</th><th></th>
      <th>state</th></tr></thead><tbody id="orders"></tbody></table>
  </div>

  <div class="panel">
    <h2>Positions &amp; P&amp;L</h2>
    <table><thead><tr><th>instr</th><th class="num">pos</th>
      <th class="num">avg</th><th class="num">real</th>
      <th class="num">unreal</th><th class="num">covered</th></tr></thead>
      <tbody id="positions"></tbody></table>
  </div>

  <div class="panel">
    <h2>Throughput &amp; Health</h2>
    <div id="metrics"></div>
    <div style="margin-top:8px" id="session"></div>
  </div>

  <div class="panel wide">
    <h2>Decision Log — why it did (and didn't)</h2>
    <div id="log"></div>
  </div>

  <div class="panel">
    <h2>Chaos</h2>
    <div id="chaos">
      <button onclick="demo('trade')">place trade</button>
      <button onclick="demo('storm')">fill storm ×10</button>
      <button class="danger" onclick="demo('timeout')">timeout + hidden fill</button>
      <button class="danger" onclick="demo('crash')">corrupt + recover</button>
      <button onclick="demo('flatten')">arm protection</button>
    </div>
  </div>

  <div class="panel wide">
    <h2>Ledger Tail</h2>
    <div id="ledger"></div>
  </div>

  <div class="panel">
    <h2>Latency (ms)</h2>
    <div id="latency"></div>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);

function render(s) {
  $("authority").textContent = s.authority;
  $("accepting").innerHTML = s.halted
    ? '<span class="dot bad"></span> HALTED'
    : (s.accepting ? '<span class="dot ok"></span> accepting'
                   : '<span class="dot bad"></span> not accepting');
  $("invs").innerHTML = Object.entries(s.invariants).map(([k, ok]) =>
    `<span class="dot ${ok ? "ok" : "bad"}" title="${k}"></span>`).join("");
  if (s.session.mark_price)
    $("mark").textContent = "IDX-OPT " + s.session.mark_price;

  $("orders").innerHTML = s.orders.map(o => {
    const pct = 100 * parseFloat(o.filled) / parseFloat(o.qty);
    return `<tr><td>${o.key}${o.authority === "PROTECTIVE_EXIT" ? " 🛡" : ""}</td>
      <td>${o.side}</td><td>${o.filled}/${o.qty}</td>
      <td><span class="fillbar"><i style="width:${pct}%"></i></span></td>
      <td><span class="state ${o.state}">${o.state}</span></td></tr>`;
  }).join("");

  $("positions").innerHTML = s.positions.map(p => {
    const ur = p.unrealized === null ? "—" : p.unrealized;
    const cls = v => parseFloat(v) >= 0 ? "pos-green" : "pos-red";
    return `<tr><td>${p.instrument}</td>
      <td class="num">${p.position}</td>
      <td class="num">${p.avg_cost ?? "—"}</td>
      <td class="num ${cls(p.realized)}">${p.realized}</td>
      <td class="num ${p.unrealized ? cls(p.unrealized) : ""}">${ur}</td>
      <td class="num">${p.covered}${parseFloat(p.uncovered) > 0
        ? ` <span class="pos-red">(${p.uncovered} naked)</span>` : " ✓"}</td>
      </tr>`;
  }).join("");

  const m = s.metrics;
  $("metrics").innerHTML =
    `<span class="metric"><b>${m.rates.events_applied ?? 0}</b>
       <span>events/s</span></span>
     <span class="metric"><b>${m.gauges.queue_depth ?? 0}</b>
       <span>queue depth</span></span>
     <span class="metric"><b>${m.counters.events_applied ?? 0}</b>
       <span>events total</span></span>
     <span class="metric"><b>${m.counters.reconciliations ?? 0}</b>
       <span>recons</span></span>`;
  $("session").innerHTML =
    `broker: ${s.session.broker} · feed age ${s.session.feed_age}s ·
     task failures ${s.session.task_failures}`;

  const lat = m.latency.event_apply_ms || {};
  $("latency").innerHTML = ["p50", "p95", "p99"].map(p =>
    `<span class="metric"><b>${lat[p] ?? "—"}</b><span>${p}</span></span>`
  ).join("");

  $("log").innerHTML = s.decisions.map(d => {
    const cls = d.decision.includes("BLOCKED") ? "blocked"
      : d.decision.includes("ARMED") ? "armed" : "";
    return `<div class="logline"><span class="t">#${d.seq}</span>
      <span class="${cls}">${d.decision}</span>
      ${d.detail.key ?? ""} ${d.detail.reason ?? ""}
      ${d.detail.requested_qty ? `(asked ${d.detail.requested_qty},
        got ${d.detail.qty})` : ""}</div>`;
  }).join("");

  $("ledger").innerHTML = s.ledger.map(e =>
    `<div class="logline"><span class="t">seq ${e.seq} · ${e.trace}</span>
     ${e.order ?? ""} ${e.kind}
     ${e.from ? `<span class="t">${e.from} →</span> ${e.to}` : ""}</div>`
  ).join("");
}

async function demo(action) {
  const res = await fetch("/demo/" + action, { method: "POST" });
  const body = await res.json();
  const toast = $("toast");
  toast.textContent = action + ": " + JSON.stringify(body);
  toast.style.opacity = 1;
  setTimeout(() => toast.style.opacity = 0, 2500);
}

function connect() {
  const ws = new WebSocket(
    (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () =>
    $("conn").innerHTML = '<span class="dot ok"></span> live';
  ws.onmessage = ev => render(JSON.parse(ev.data));
  ws.onclose = () => {
    $("conn").innerHTML = '<span class="dot bad"></span> reconnecting…';
    setTimeout(connect, 1000);
  };
}
connect();
</script>
</body>
</html>
